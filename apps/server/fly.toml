# Fly.io config for @squidbox/server. Deploy from the repo ROOT so the Docker build context
# includes packages/shared:  fly deploy --config apps/server/fly.toml
# `app` is set by `fly launch`/`fly apps create`. lhr (London) is the closest region to the
# S3 bucket in AWS eu-west-1 (Ireland), minimizing upload latency + cross-region transfer.
app = "squidbox-server"
primary_region = "lhr"

# NOTE: no [build] dockerfile here — the build CONTEXT must be the repo root (for packages/shared),
# which fly.toml can't express when it lives in apps/. Deploy from the repo root with:
#   fly deploy . --config apps/server/fly.toml --dockerfile apps/server/Dockerfile

[env]
  PORT = "3100"
  # AWS_REGION / S3_SHARED_BUCKET / JWT_SECRET / AWS creds / DATABASE_URL are set as SECRETS.

# Run migrations on every deploy (idempotent) before the new version goes live.
[deploy]
  release_command = "npm run migrate:prod"

[http_service]
  internal_port = 3100
  force_https = true
  # Always-on: large streaming uploads must not be interrupted by machine auto-stop.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/up"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb" # headroom for multipart upload buffers (queueSize parts in flight)
