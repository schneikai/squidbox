# Local dev stack for @squidbox/server: Postgres + MinIO (S3-compatible).
# Run the server on the host (npm run dev) pointing at these via .env (see .env.example
# "Local dev" block). Start with:  docker compose up -d   (from apps/server)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: squidbox
      POSTGRES_PASSWORD: squidbox
      POSTGRES_DB: squidbox
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U squidbox']
      interval: 5s
      timeout: 5s
      retries: 10

  # minio/minio is no longer published on Docker Hub; Chainguard's image is the same server.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console (http://localhost:9001, minioadmin/minioadmin)
    volumes:
      - miniodata:/data

  # One-shot: create the shared bucket + the legacy bucket for the seeded existing user.
  # The image has no shell, so it retries via restart until MinIO accepts connections.
  createbuckets:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    restart: on-failure
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    command: ['mb', '--ignore-existing', 'local/squidbox-shared', 'local/squidbox-legacy']

volumes:
  pgdata:
  miniodata:
