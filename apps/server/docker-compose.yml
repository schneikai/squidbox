# Local dev stack for @squidbox/server: Postgres + MinIO (S3-compatible).
# Run the server on the host (npm run dev) pointing at these via .env (see .env.example
# "Local dev" block). Start with:  docker compose up -d   (from apps/server)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: squidbox
      POSTGRES_PASSWORD: squidbox
      POSTGRES_DB: squidbox
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U squidbox']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console (http://localhost:9001, minioadmin/minioadmin)
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the shared bucket + the legacy bucket for the seeded existing user.
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/squidbox-shared;
      mc mb -p local/squidbox-legacy;
      echo 'buckets ready';
      "

volumes:
  pgdata:
  miniodata:
