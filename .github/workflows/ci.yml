name: ci

# Needs no secrets: the DB-backed tests run against a throwaway Postgres service container.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a PR cancels its running check; every commit on main keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same as apps/server/docker-compose.yml, so .env.docker and the test:db / test:e2e scripts
      # reach it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: squidbox
          POSTGRES_PASSWORD: squidbox
          POSTGRES_DB: squidbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squidbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      - run: npm run typecheck
      - run: cp .env.docker .env && npm run db:migrate
        working-directory: apps/server
      # FUZZ_DEEP: every seeded case, not the tenth a plain run takes.
      - run: npm run test:db --workspace apps/server
        env:
          FUZZ_DEEP: 1
      - run: npm run test:e2e --workspace apps/mobile
        env:
          FUZZ_DEEP: 1
