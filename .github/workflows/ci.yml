name: ci

# Needs no secrets: the DB-backed tests run against a throwaway Postgres service container, and the UI
# flow tests (ui-flows) against their own Docker stack (apps/server/docker-compose.yml, as dev:local runs).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a PR cancels its running check; every commit on main keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same as apps/server/docker-compose.yml, so .env.docker and the test:db / test:e2e scripts
      # reach it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: squidbox
          POSTGRES_PASSWORD: squidbox
          POSTGRES_DB: squidbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squidbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run knip
      - run: npm run typecheck
      - run: cp .env.docker .env && npm run db:migrate
        working-directory: apps/server
      # FUZZ_DEEP: every seeded case, not the tenth a plain run takes.
      - run: npm run test:db --workspace apps/server
        env:
          FUZZ_DEEP: 1
      - run: npm run test:e2e --workspace apps/mobile
        env:
          FUZZ_DEEP: 1

  # The Playwright flows in apps/mobile/e2e on the web build. MinIO can't be a service container (it
  # needs a command, and its buckets a one-shot), so scripts/dev.mjs --web brings up the compose stack
  # itself (Postgres + MinIO), then the API server and Metro; the mock photos come from picsum.
  ui-flows:
    runs-on: ubuntu-latest
    # Cold Docker pulls, the mock photos and the first web bundle come before the first test.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          cache: npm

      - run: npm ci

      # The browser build follows Playwright's version, so the cache does too.
      - id: playwright
        run: echo "version=$(npx playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
        working-directory: apps/mobile

      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # A cached browser still needs its system libraries.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/mobile
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/mobile

      - run: npm run test:ui --workspace apps/mobile

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-flows-test-results
          path: apps/mobile/test-results
