name: ci

# Needs no secrets: the DB-backed tests run against a throwaway Postgres service container, and the UI
# flow tests (ui-flows) against their own Docker stack (apps/server/docker-compose.yml, as dev:local runs).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a PR cancels its running check; every commit on main keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same as apps/server/docker-compose.yml, so .env.docker and the test:db / test:e2e scripts
      # reach it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: squidbox
          POSTGRES_PASSWORD: squidbox
          POSTGRES_DB: squidbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squidbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run knip
      - run: node scripts/checkNewFiles.mjs
      - run: npm run typecheck
      - run: cp .env.docker .env && npm run db:migrate
        working-directory: apps/server
      # FUZZ_DEEP: every seeded case, not the tenth a plain run takes.
      - run: npm run test:db --workspace apps/server
        env:
          FUZZ_DEEP: 1
      - run: npm run test:e2e --workspace apps/mobile
        env:
          FUZZ_DEEP: 1

  # The Playwright flows in apps/mobile/e2e on the web build. MinIO can't be a service container (it
  # needs a command, and its buckets a one-shot), so scripts/dev.mjs --web brings up the compose stack
  # itself (Postgres + MinIO), then the API server and Metro; the mock photos and videos are committed.
  ui-flows:
    # Playwright 1.56 can't install Chromium's dependencies on ubuntu-latest (26.04): pinned until it can.
    runs-on: ubuntu-24.04
    # Cold Docker pulls and the first web bundle come before the first test.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          cache: npm

      - run: npm ci

      # The browser build follows Playwright's version, so the cache does too.
      - id: playwright
        run: echo "version=$(npx playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
        working-directory: apps/mobile

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Downloads the browser only on a cache miss; its system libraries every time.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/mobile

      # Metro's transform cache, with the key dev.mjs checks before it clears it (metroCacheArgs:
      # the packages and the Babel and Metro configs; CI has no .env.local).
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/metro-cache
            node_modules/.cache/squidbox-dev
          key: metro-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/mobile/babel.config.js', 'apps/mobile/metro.config.js') }}

      - run: npm run test:ui --workspace apps/mobile

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-flows-test-results
          # The traces, and the API server's log (scripts/dev.mjs writes it to the temp folder).
          path: |
            apps/mobile/test-results
            /tmp/squidbox-server.log
